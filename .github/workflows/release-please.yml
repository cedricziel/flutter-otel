name: release-please

# Opens (and keeps in sync) a release PR that bumps the versions and
# CHANGELOGs of the packages changed by conventional commits since their last
# release. Versions stay below 1.0.0 with small steps: a feat or fix bumps the
# patch, a breaking change bumps the minor (release-please-config.json).
# Merging the PR tags each released package as `<package>-v<version>` and
# creates its GitHub release.
#
# `RELEASE_PLEASE_TOKEN` (a PAT) is preferred: a PR opened by GITHUB_TOKEN does
# not trigger `ci.yml`, which would leave the release PR ungated.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
