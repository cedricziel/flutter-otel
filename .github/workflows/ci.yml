name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: "3.47.2"

permissions:
  contents: read

jobs:
  ci:
    # A standard Linux runner is sufficient here: flutter_otel_native's
    # Dart-side tests don't need a real device/simulator. The native Swift
    # code and the example app build are covered by the separate
    # macos-native-tests job below instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # Resolves every workspace member (packages/*) in one go.
      - name: flutter pub get (workspace root)
        run: flutter pub get

      - name: Format check (whole workspace)
        run: dart format --output=none --set-exit-if-changed .

      # --- dart_otel_api: pure Dart, no Flutter dependency ---
      - name: Analyze dart_otel_api
        working-directory: packages/dart_otel_api
        run: dart analyze
      - name: Test dart_otel_api
        working-directory: packages/dart_otel_api
        run: dart test

      # --- dart_otel_exporter_otlp_http: pure Dart, no Flutter dependency ---
      - name: Analyze dart_otel_exporter_otlp_http
        working-directory: packages/dart_otel_exporter_otlp_http
        run: dart analyze
      - name: Test dart_otel_exporter_otlp_http
        working-directory: packages/dart_otel_exporter_otlp_http
        run: dart test

      # --- dart_otel_instrumentation_dio: pure Dart (Dio has no Flutter
      # dependency either), so this also uses dart analyze/dart test.
      - name: Analyze dart_otel_instrumentation_dio
        working-directory: packages/dart_otel_instrumentation_dio
        run: dart analyze
      - name: Test dart_otel_instrumentation_dio
        working-directory: packages/dart_otel_instrumentation_dio
        run: dart test

      # --- dart_otel_instrumentation_http: pure Dart, like the Dio one.
      - name: Analyze dart_otel_instrumentation_http
        working-directory: packages/dart_otel_instrumentation_http
        run: dart analyze
      - name: Test dart_otel_instrumentation_http
        working-directory: packages/dart_otel_instrumentation_http
        run: dart test

      # --- dart_otel_instrumentation_messaging: pure Dart, only depends
      # on dart_otel_api.
      - name: Analyze dart_otel_instrumentation_messaging
        working-directory: packages/dart_otel_instrumentation_messaging
        run: dart analyze
      - name: Test dart_otel_instrumentation_messaging
        working-directory: packages/dart_otel_instrumentation_messaging
        run: dart test

      # --- dart_otel_sdk: pure Dart, no Flutter dependency ---
      - name: Analyze dart_otel_sdk
        working-directory: packages/dart_otel_sdk
        run: dart analyze
      - name: Test dart_otel_sdk
        working-directory: packages/dart_otel_sdk
        run: dart test

      # --- flutter_otel_native: depends on Flutter (MethodChannel). Only
      # the Dart side is tested here — the Swift side has no Flutter
      # dependency and is tested by the macos-native-tests job below,
      # which needs no Xcode/iOS toolchain setup at all as a result.
      - name: Analyze flutter_otel_native
        working-directory: packages/flutter_otel_native
        run: flutter analyze
      - name: Test flutter_otel_native
        working-directory: packages/flutter_otel_native
        run: flutter test

      # --- flutter_otel: umbrella package, depends on Flutter ---
      - name: Analyze flutter_otel
        working-directory: packages/flutter_otel
        run: flutter analyze
      - name: Test flutter_otel
        working-directory: packages/flutter_otel
        run: flutter test

      # --- flutter_otel_device_info: depends on Flutter (device_info_plus) ---
      - name: Analyze flutter_otel_device_info
        working-directory: packages/flutter_otel_device_info
        run: flutter analyze
      - name: Test flutter_otel_device_info
        working-directory: packages/flutter_otel_device_info
        run: flutter test

  macos-native-tests:
    # NativeTelemetryCore has no Flutter dependency, so swift test only
    # needs the Swift toolchain macos-latest ships with. Building the
    # example app below exercises the Flutter/Xcode side (the plugin and
    # its podspecs) that swift test alone does not touch.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: swift test (NativeTelemetryCore)
        working-directory: packages/flutter_otel_native/native/NativeTelemetryCore
        run: swift test

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: flutter pub get (example)
        working-directory: packages/flutter_otel_native/example
        run: flutter pub get

      - name: Build macOS example app (exercises the podspec/Package.swift wiring)
        working-directory: packages/flutter_otel_native/example
        run: flutter build macos --debug
