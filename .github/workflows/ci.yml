name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: "3.47.2"

permissions:
  contents: read

jobs:
  ci:
    # A standard Linux runner is sufficient: nothing in this repo touches
    # platform channels or native code, so no macOS/Xcode setup is needed
    # here even though iOS/macOS are the primary supported targets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # Resolves every workspace member (packages/*) in one go.
      - name: flutter pub get (workspace root)
        run: flutter pub get

      - name: Format check (whole workspace)
        run: dart format --output=none --set-exit-if-changed .

      # --- flutter_otel_api: pure Dart, no Flutter dependency ---
      - name: Analyze flutter_otel_api
        working-directory: packages/flutter_otel_api
        run: dart analyze
      - name: Test flutter_otel_api
        working-directory: packages/flutter_otel_api
        run: dart test

      # --- flutter_otel_exporter_otlp_http: pure Dart, no Flutter dependency ---
      - name: Analyze flutter_otel_exporter_otlp_http
        working-directory: packages/flutter_otel_exporter_otlp_http
        run: dart analyze
      - name: Test flutter_otel_exporter_otlp_http
        working-directory: packages/flutter_otel_exporter_otlp_http
        run: dart test

      # --- flutter_otel_instrumentation_dio: pure Dart (Dio has no Flutter
      # dependency either), so this also uses dart analyze/dart test.
      - name: Analyze flutter_otel_instrumentation_dio
        working-directory: packages/flutter_otel_instrumentation_dio
        run: dart analyze
      - name: Test flutter_otel_instrumentation_dio
        working-directory: packages/flutter_otel_instrumentation_dio
        run: dart test

      # --- flutter_otel_sdk: depends on Flutter (WidgetsBindingObserver) ---
      - name: Analyze flutter_otel_sdk
        working-directory: packages/flutter_otel_sdk
        run: flutter analyze
      - name: Test flutter_otel_sdk
        working-directory: packages/flutter_otel_sdk
        run: flutter test

      # --- flutter_otel_native: depends on Flutter (MethodChannel). Only
      # the Dart side is tested here — the Swift side has no Flutter
      # dependency and is tested by the macos-native-tests job below,
      # which needs no Xcode/iOS toolchain setup at all as a result.
      - name: Analyze flutter_otel_native
        working-directory: packages/flutter_otel_native
        run: flutter analyze
      - name: Test flutter_otel_native
        working-directory: packages/flutter_otel_native
        run: flutter test

      # --- flutter_otel: umbrella package, depends on Flutter ---
      - name: Analyze flutter_otel
        working-directory: packages/flutter_otel
        run: flutter analyze
      - name: Test flutter_otel
        working-directory: packages/flutter_otel
        run: flutter test

  macos-native-tests:
    # NativeTelemetryCore has no Flutter dependency, so this only needs
    # the Swift toolchain macos-latest ships with — no Flutter/Xcode
    # project setup required.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: swift test (NativeTelemetryCore)
        working-directory: packages/flutter_otel_native/native/NativeTelemetryCore
        run: swift test
