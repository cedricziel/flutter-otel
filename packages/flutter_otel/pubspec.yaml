name: flutter_otel
description: >
  Batteries-included OpenTelemetry SDK for Flutter apps: the logs signal,
  optional session tracking, and an OTLP/HTTP exporter today, with traces
  and metrics designed to slot in later. This is the package apps depend on.
version: 0.1.0
homepage: https://github.com/cedricziel/flutter-otel

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_otel_api: ^0.1.0
  flutter_otel_exporter_otlp_http: ^0.1.0
  flutter_otel_sdk: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  http: ^1.2.0

resolution: workspace
