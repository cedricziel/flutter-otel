name: flutter_otel
description: >
  Batteries-included OpenTelemetry SDK for Flutter apps: logs, traces and
  metrics, optional session tracking, and OTLP/HTTP exporters. This is the
  package apps depend on.
version: 0.1.8
homepage: https://github.com/cedricziel/flutter-otel

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  dart_otel_api: ^0.1.1
  dart_otel_exporter_otlp_http: ^0.1.1
  dart_otel_sdk: ^0.1.4
  http: ^1.2.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.3

resolution: workspace
