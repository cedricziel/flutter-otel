name: flutter_otel
description: >
  Batteries-included OpenTelemetry SDK for Flutter apps: the logs signal,
  optional session tracking, and an OTLP/HTTP exporter today, with traces
  and metrics designed to slot in later. This is the package apps depend on.
version: 0.1.1
homepage: https://github.com/cedricziel/flutter-otel

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  dart_otel_api: ^0.1.0
  dart_otel_exporter_otlp_http: ^0.1.0
  dart_otel_sdk: ^0.1.0
  http: ^1.2.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

resolution: workspace
