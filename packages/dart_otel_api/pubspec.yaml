name: dart_otel_api
description: >
  Platform-agnostic OpenTelemetry core API for flutter_otel: Resource,
  signal interfaces (logs, traces, metrics), and the
  processor/exporter pipeline contracts. Pure Dart, no Flutter dependency.
version: 0.1.2
homepage: https://github.com/cedricziel/flutter-otel

environment:
  sdk: ^3.6.0

dependencies:
  meta: ^1.15.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

resolution: workspace
