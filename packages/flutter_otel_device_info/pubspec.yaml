name: flutter_otel_device_info
description: >
  Device attributes (OS, hardware model, form factor) for OpenTelemetry
  resources in Flutter apps, drawn from an explicit allowlist, and an opt-in,
  vendor-scoped app installation ID.
version: 0.1.1
homepage: https://github.com/cedricziel/flutter-otel

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ">=12.4.0 <14.0.0"
  android_id: ^0.6.0
  path_provider: ^2.1.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

resolution: workspace
