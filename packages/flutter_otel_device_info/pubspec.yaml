name: flutter_otel_device_info
description: >
  Coarse, non-identifying device attributes (OS, hardware model, form factor)
  for OpenTelemetry resources in Flutter apps, drawn from an explicit
  allowlist that never includes device names, hardware IDs or locale.
version: 0.1.0
homepage: https://github.com/cedricziel/flutter-otel

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ">=12.4.0 <14.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

resolution: workspace
