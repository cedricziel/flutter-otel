name: flutter_otel_sdk
description: >
  Concrete OpenTelemetry SDK implementation: log and span processors.
  Depends on flutter_otel_api. Pure Dart, no Flutter dependency — the
  Flutter-specific facade and session tracking live in flutter_otel, which
  builds on this package.
version: 0.1.0
homepage: https://github.com/cedricziel/flutter-otel

environment:
  sdk: ^3.6.0

dependencies:
  flutter_otel_api: ^0.1.0
  http: ^1.2.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

resolution: workspace
