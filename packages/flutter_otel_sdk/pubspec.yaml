name: flutter_otel_sdk
description: >
  Concrete OpenTelemetry SDK implementation for Flutter: log processors,
  session tracking, and the OTelSdk facade. Depends on flutter_otel_api and
  Flutter (for WidgetsBindingObserver-based session lifecycle handling).
version: 0.1.0
homepage: https://github.com/cedricziel/flutter-otel

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_otel_api: ^0.1.0
  flutter_otel_exporter_otlp_http: ^0.1.0
  http: ^1.2.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

resolution: workspace
